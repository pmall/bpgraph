# Pinned so containers and the data volume keep their names whatever the
# checkout directory is called.
name: bpgraph

services:
  # Graph database. Speaks RESP on 6379.
  # Published to the host so local scripts (python) can connect on localhost:6379.
  falkordb-server:
    image: falkordb/falkordb-server:latest
    ports:
      - "6379:6379"
    environment:
      REDIS_ARGS: ${FALKORDB_PASSWORD:+--requirepass ${FALKORDB_PASSWORD}}
      FALKORDB_ARGS: THREAD_COUNT ${FALKORDB_THREADS:-4}
    volumes:
      - falkordb_data:/data

  # Browser UI. Published so you can open http://localhost:3000.
  # It connects to the server itself, over the compose network, so its
  # login form takes host "falkordb-server" (not localhost).
  falkordb-browser:
    image: falkordb/falkordb-browser:latest
    ports:
      - "3000:3000"
    depends_on:
      - falkordb-server

  # MCP server, built from this repository. Published so MCP clients reach
  # http://localhost:8080/mcp. Reaches the database over the compose network.
  # Its only tool runs read-only queries: builds write on 6379, never here.
  bpgraph-mcp:
    build: .
    ports:
      - "8080:8080"
    environment:
      FALKORDB_HOST: falkordb-server
      FALKORDB_PORT: 6379
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8080
    depends_on:
      - falkordb-server

volumes:
  falkordb_data:
