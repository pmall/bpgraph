# The workspace of bpgraph: graph, the graph and everything around it (its build, its
# query API, its MCP server). Each member is a package of its own; the root only runs
# their tools together.

[tool.uv.workspace]
members = ["graph"]

[tool.uv.sources]
bpgraph = { workspace = true }

[dependency-groups]
dev = [
    "bpgraph",
    "mdformat>=1.0.0",
    "mdformat-frontmatter>=2.1.2",
    "mdformat-gfm>=1.0.0",
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.9",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["graph/src", "graph/tests"]

[tool.pytest.ini_options]
testpaths = ["graph/tests"]
