[project]
name = "bpgraph"
version = "0.1.0"
description = "FalkorDB graph of protein-protein interactions: ingestion, validation and a read-only MCP server"
readme = "README.md"
authors = [
    { name = "pmall", email = "pierre.mallinjoud@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "falkordb>=1.7.1",
    "mcp>=2.2.0",
    "pydantic>=2.13.5",
]

[project.scripts]
bpgraph = "bpgraph:main"
bpgraph-audit = "bpgraph.audit:main"
bpgraph-functions = "bpgraph.uniprot:main"
bpgraph-go = "bpgraph.go:main"
bpgraph-network = "bpgraph.network:main"
bpgraph-mcp = "bpgraph.server:main"
bpgraph-query = "bpgraph.query:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pyright>=1.1",
    "pytest>=8",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "mdformat-frontmatter>=2.1.2",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
