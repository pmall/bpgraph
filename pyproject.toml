# The workspace of bpgraph: graph, the graph and everything around it (its build, its
# query API, its MCP server), and client, what a repository consulting the graph needs.
# Each member is a package of its own; the root only runs their tools together.

[tool.uv.workspace]
members = ["graph", "client"]

[tool.uv.sources]
bpgraph = { workspace = true }
bpgraph-client = { workspace = true }

[dependency-groups]
dev = [
    "bpgraph",
    "bpgraph-client",
    "mdformat>=1.0.0",
    "mdformat-frontmatter>=2.1.2",
    "mdformat-gfm>=1.0.0",
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.9",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID251"]

[tool.pyright]
include = ["graph/src", "client/src", "client/tests"]

[tool.pytest.ini_options]
testpaths = ["client/tests"]
